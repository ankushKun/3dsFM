name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (ASan + UBSan)
        run: make -C tests check

  build:
    name: 3DSX and CIA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with the pinned toolchain
        run: ./scripts/build.sh
        env:
          THREEDSFM_BUILD_JOBS: 4
      - uses: actions/upload-artifact@v4
        with:
          name: 3dsFM-${{ github.sha }}
          path: dist/
          if-no-files-found: error
